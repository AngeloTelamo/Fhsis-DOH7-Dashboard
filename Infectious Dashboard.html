<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Infectious Diseases Dashboard 2025</title><link rel="icon" type="image/png" href="DOH_Logo (1).png"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style> * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); min-height: 100vh; padding: 20px; } .container { max-width: 1400px; margin: 0 auto; } .header { background: white; border-radius: 16px; padding: 30px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; } .header-content { flex: 1; min-width: 250px; } .header h1 { color: #991b1b; font-size: 28px; margin-bottom: 10px; } .header p { color: #b91c1c; font-size: 14px; } .header-logo { display: flex; align-items: center; gap: 12px; text-align: right; } .header-logo img { width: 70px; height: 70px; flex-shrink: 0; object-fit: contain; } .controls { background: white; border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; min-height: 140px; } .control-group { display: flex; flex-direction: column; gap: 8px; } .control-group label { font-size: 13px; font-weight: 600; color: #991b1b; text-transform: uppercase; letter-spacing: 0.5px; } select { padding: 12px 16px; border: 2px solid #fee2e2; border-radius: 8px; font-size: 14px; min-width: 340px; background: white; cursor: pointer; transition: all 0.3s; } select:focus { outline: none; border-color: #ef4444; } .quarter-buttons { display: flex; gap: 10px; flex-wrap: wrap; } .quarter-btn { padding: 10px 20px; border: 2px solid #fee2e2; background: white; border-radius: 8px; cursor: pointer; font-weight: 600; color: #991b1b; transition: all 0.3s; } .quarter-btn:hover { border-color: #ef4444; color: #ef4444; } .quarter-btn.active { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; border-color: transparent; } .category-label { display: none; align-items: center; padding: 10px 16px; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; border-radius: 8px; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; white-space: normal; margin-left: 10px; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); max-width: 380px; line-height: 1.3; text-align: center; min-height: 44px; } .category-label.show { display: flex; } .export-btn { padding: 12px 24px; background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.3s; margin-left: auto; } .export-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(220, 38, 38, 0.4); } .chart-container { background: white; border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); } .chart-wrapper { position: relative; height: 420px; } .table-container { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow-x: auto; } .table-container h2 { margin-bottom: 20px; color: #991b1b; font-size: 20px; } table { width: 100%; border-collapse: collapse; } th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #eee; } th { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; white-space: normal; line-height: 1.3; min-width: 80px; max-width: 200px; vertical-align: bottom; } tr:hover { background: #fef2f2; } td { color: #374151; font-size: 13px; } .number { text-align: right; font-family: 'Courier New', monospace; } .percent { text-align: right; color: #dc2626; font-weight: 600; } .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; } .summary-card { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; } .summary-card h3 { font-size: 13px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; } .summary-card .value { font-size: 32px; font-weight: 700; color: #991b1b; } .summary-card .sub-value { font-size: 14px; color: #dc2626; margin-top: 5px; } </style></head><body><div class="container"><div class="header"><div class="header-content"><h1>Infectious Diseases Dashboard 2025</h1><p>Field Health Service Information System - Infectious Disease Surveillance Data Visualization (Region 7)</p></div><div class="header-logo" title="Department of Health - Philippines"><img src="DOH_Logo (1).png" alt="DOH Philippines Logo"></div></div><div class="controls"><div class="control-group"><label for="indicator">Select Indicator</label><select id="indicator"><option value="Filariasis">Filariasis Prevention (Case Detection & Clinical Rate)</option><option value="Rabies">Rabies - Animal Bites and Deaths</option><option value="Schistosomiasis">Schistosomiasis Prevention and Control</option><option value="STH_Children">Soil-Transmitted Helminthiasis - Children (1-9 years old)</option><option value="STH_Other">Soil-Transmitted Helminthiasis - Adolescents/WRA/Pregnant</option><option value="Leprosy">Leprosy - Prevalence Rate and Case Detection</option><option value="Syphilis">Syphilis - Pregnant Women Screened and Positive</option><option value="HIV">HIV - Pregnant Women Screened and Reactive</option></select></div><div class="control-group"><label id="periodLabel">Select Period</label><div class="quarter-buttons" id="periodButtons"><button class="quarter-btn active" data-quarter="Qtr1">Q1</button><button class="quarter-btn" data-quarter="Qtr2">Q2</button><button class="quarter-btn" data-quarter="Qtr3">Q3</button><button class="quarter-btn" data-quarter="Qtr4">Q4</button><button class="quarter-btn" data-quarter="Annual">Annual</button><span id="categoryLabel" class="category-label show">Filariasis Prevention (Case Detection & Clinical Rate)</span></div></div></div><div class="summary-cards" id="summaryCards"><div class="summary-card"><h3 id="summaryLabel1">-</h3><div class="value" id="summaryValue1">-</div></div><div class="summary-card"><h3 id="summaryLabel2">-</h3><div class="value" id="summaryValue2">-</div></div><div class="summary-card"><h3 id="summaryLabel3">-</h3><div class="value" id="summaryValue3">-</div><div class="sub-value" id="summarySub3"></div></div></div><div class="chart-container" id="standardChartContainer"><div class="chart-wrapper"><canvas id="chart"></canvas></div></div><div class="table-container"><h2>Data Table</h2><table id="dataTable"><thead id="tableHead"><tr><th>Area</th><th>Indicator</th></tr></thead><tbody id="tableBody"></tbody></table></div></div><script src="Infectious Dashboard.min.js"></script><div id="dataNotice" style="position:fixed;bottom:10px;right:10px;background:rgba(0,0,0,0.75);color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;z-index:9999;font-family:sans-serif;pointer-events:none;"> Official FHSIS Data — Unauthorized extraction prohibited
